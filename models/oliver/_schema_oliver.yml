version: 2

models:
  - name: oliver_dim_customer
    description: "One row per customer."
    columns:
      - name: cust_key
        tests: [unique, not_null]

  - name: oliver_dim_employee
    description: "One row per employee."
    columns:
      - name: employee_key
        tests: [unique, not_null]

  - name: oliver_dim_product
    description: "One row per product."
    columns:
      - name: product_key
        tests: [unique, not_null]

  - name: oliver_dim_store
    description: "One row per store."
    columns:
      - name: store_key
        tests: [unique, not_null]

  - name: oliver_dim_date
    description: "One row per order date."
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fact_sales
    description: "One row per product on each order."

  - name: stg_employee_certifications
    description: |
      Staging model for employee certification data.
      Parses certification_json into certification_name, certification_cost,
      and certification_awarded_date. One row per certification awarded to an employee.
  - name: fact_certification
    description: |
      Employee Certification Fact.
      The grain of this table is employee + certification + date awarded.
      Each record represents one certification an employee received on a given date, with its cost.